name: Tests and container
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          MOCK_LLM: 'true'
      - run: docker build -t smart-grocery .
      - name: Container smoke test
        run: |
          docker run -d --name grocery -p 8501:8501 -e MOCK_LLM=true smart-grocery
          trap 'docker logs grocery; docker rm -f grocery' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          exit 1
